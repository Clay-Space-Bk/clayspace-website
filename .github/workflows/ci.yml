name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Build first: it generates next-env.d.ts, which declares the module
      # types for static image imports (.png/.webp). Running tsc before the
      # build fails with TS2307 on every image in src/data.
      # `ignoreBuildErrors` is absent, so this build also typechecks.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Brand colours must reach the page as --cs-* from @clayspace/tokens.
      # A hex typed into a component is invisible to a palette change.
      - name: Token compliance
        run: npm run check:tokens
